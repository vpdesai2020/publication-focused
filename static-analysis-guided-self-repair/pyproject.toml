[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sag-self-repair"
version = "0.1.0"
description = "Static-analysis-guided repair loop for LLM-generated code with functionality preservation."
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name = "Research prototype" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "bandit>=1.9,<2",
  "semgrep>=1.79,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "outputs"]
skips = []
