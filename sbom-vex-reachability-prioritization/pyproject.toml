[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnprior"
version = "0.1.0"
description = "SBOM, VEX, and reachability aware vulnerability prioritization research prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vulnprior = "vulnprior.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

